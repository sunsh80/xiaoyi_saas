# ============================================================
# 订单模块 Schema - OrderPayload / Order / OrderResponse / OrderListResponse
# 模块: order
# 说明: OrderPayload 合并了原 CreateOrder + UpdateOrder（字段相同，仅 required 不同）
# ============================================================

OrderPayload:
  type: object
  required:
    - title
    - pickup_address
    - delivery_address
    - amount
  properties:
    title:
      type: string
      description: 订单标题
    description:
      type: string
      description: 订单描述
    pickup_address:
      type: string
      description: 取货地址
    delivery_address:
      type: string
      description: 送货地址
    pickup_time:
      type: string
      format: date-time
      description: 取货时间
    delivery_time:
      type: string
      format: date-time
      description: 送达时间
    distance:
      type: number
      description: 距离(公里)
    weight:
      type: number
      description: 重量(公斤)
    volume:
      type: number
      description: 体积(立方米)
    amount:
      type: number
      description: 金额

Order:
  type: object
  properties:
    id:
      type: integer
      example: 1
    order_no:
      type: string
      example: "XY2401231503210001"
    title:
      type: string
      example: "办公室搬迁"
    description:
      type: string
      example: "搬迁办公设备和文件"
    pickup_address:
      type: string
      example: "北京市朝阳区xxx大厦"
    delivery_address:
      type: string
      example: "北京市海淀区yyy园区"
    pickup_time:
      type: string
      format: date-time
      example: "2024-01-23T10:00:00.000Z"
    delivery_time:
      type: string
      format: date-time
      example: "2024-01-23T12:00:00.000Z"
    distance:
      type: number
      example: 15.5
    weight:
      type: number
      example: 150
    volume:
      type: number
      example: 5.2
    amount:
      type: number
      example: 280.00
    status:
      type: string
      enum: [pending, assigned, in_progress, completed, cancelled]
      example: "pending"
    assignee_user_id:
      type: integer
      example: 5
    assign_time:
      type: string
      format: date-time
    complete_time:
      type: string
      format: date-time
    created_at:
      type: string
      format: date-time
      example: "2024-01-23T09:00:00.000Z"
    updated_at:
      type: string
      format: date-time

OrderResponse:
  type: object
  properties:
    success:
      type: boolean
      example: true
    message:
      type: string
      example: "订单创建成功"
    data:
      type: object
      properties:
        order:
          $ref: 'order.yaml#/Order'

OrderListResponse:
  type: object
  properties:
    success:
      type: boolean
      example: true
    data:
      type: object
      properties:
        orders:
          type: array
          items:
            $ref: 'order.yaml#/Order'
        pagination:
          $ref: 'common.yaml#/Pagination'
