# ============================================================
# 第三方接入模块 Schema - ThirdPartyOrderCreate / ThirdPartyOrder / ThirdPartyOrderResponse / ReconciliationResponse
# 模块: third-party
# ============================================================

ThirdPartyOrderCreate:
  type: object
  required:
    - customer_name
    - phone
    - address
    - amount
  properties:
    third_party_order_no:
      type: string
      description: 第三方平台订单号
      example: "TP202401230001"
    customer_name:
      type: string
      description: 客户姓名
      example: "张三"
    phone:
      type: string
      description: 客户电话
      example: "13800138000"
    address:
      type: string
      description: 客户地址
      example: "北京市朝阳区xxx大厦"
    title:
      type: string
      description: 订单标题
      example: "家庭搬迁"
    description:
      type: string
      description: 订单描述
    pickup_address:
      type: string
      description: 取货地址
    delivery_address:
      type: string
      description: 送货地址
    pickup_time:
      type: string
      format: date-time
      description: 取货时间
    delivery_time:
      type: string
      format: date-time
      description: 送货时间
    distance:
      type: number
      description: 距离(km)
      example: 15.5
    weight:
      type: number
      description: 重量(kg)
      example: 150
    volume:
      type: number
      description: 体积(m³)
      example: 5.2
    amount:
      type: number
      description: 订单金额
      example: 280.00
    items:
      type: array
      description: 物品列表
      items:
        type: object
        properties:
          name:
            type: string
          quantity:
            type: integer
    notes:
      type: string
      description: 备注
    callback_url:
      type: string
      description: 状态回调地址
      example: "https://third-party.com/callback/order"

ThirdPartyOrder:
  type: object
  properties:
    id:
      type: integer
      example: 1
    order_no:
      type: string
      example: "ORD20240123000001"
    third_party_order_no:
      type: string
      example: "TP202401230001"
    source:
      type: string
      enum: [app, third_party]
      example: "third_party"
    customer_name:
      type: string
      example: "张三"
    phone:
      type: string
      example: "13800138000"
    address:
      type: string
      example: "北京市朝阳区xxx大厦"
    amount:
      type: number
      example: 280.00
    status:
      type: string
      enum: [pending, assigned, in_progress, completed, cancelled]
      example: "pending"
    callback_url:
      type: string
      example: "https://third-party.com/callback/order"
    created_at:
      type: string
      format: date-time
    updated_at:
      type: string
      format: date-time

ThirdPartyOrderResponse:
  type: object
  properties:
    success:
      type: boolean
      example: true
    message:
      type: string
      example: "订单创建成功"
    data:
      $ref: 'third-party.yaml#/ThirdPartyOrder'

ReconciliationResponse:
  type: object
  properties:
    success:
      type: boolean
      example: true
    data:
      type: object
      properties:
        orders:
          type: array
          items:
            $ref: 'third-party.yaml#/ThirdPartyOrder'
        pagination:
          type: object
          properties:
            page:
              type: integer
              example: 1
            pageSize:
              type: integer
              example: 20
            total:
              type: integer
              example: 100
            pages:
              type: integer
              example: 5
        summary:
          type: object
          description: 汇总信息
          properties:
            total_amount:
              type: number
              example: 28000.00
            order_count:
              type: integer
              example: 100
