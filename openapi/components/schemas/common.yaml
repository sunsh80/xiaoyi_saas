# ============================================================
# 通用组件 - ErrorResponse / Pagination / ChangePasswordRequest
# 模块: common
# ============================================================

ErrorResponse:
  type: object
  properties:
    success:
      type: boolean
      example: false
    message:
      type: string
      example: "错误信息"

Pagination:
  type: object
  properties:
    page:
      type: integer
      example: 1
    limit:
      type: integer
      example: 10
    total:
      type: integer
      example: 100
    pages:
      type: integer
      example: 10

ChangePasswordRequest:
  type: object
  required:
    - oldPassword
    - newPassword
  properties:
    oldPassword:
      type: string
      description: 原密码
    newPassword:
      type: string
      description: 新密码
