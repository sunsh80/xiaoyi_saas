# ============================================================
# 订单模块路径 - Orders（8 端点）
# 模块: orders
# ============================================================

paths:
  /orders:
    get:
      summary: 获取订单列表
      description: |
        根据用户角色返回不同订单：
        - 租户管理员/用户：返回本租户的订单
        - 工人：
          - 查询待处理订单(status=pending)：返回其他租户的待处理订单（不包括自己租户的订单）
          - 查询所有订单(无status参数)：返回分配给自己的订单
          - 查询特定状态订单：返回分配给自己的该状态订单
        - 平台管理员：返回所有订单（根据status参数筛选）
      tags:
        - Orders
      security:
        - bearerAuth: []
      parameters:
        - in: header
          name: x-tenant-code
          required: true
          schema:
            type: string
          description: 租户编码
        - in: query
          name: status
          schema:
            type: string
            enum: [pending, assigned, in_progress, completed, cancelled]
          description: 订单状态筛选
        - in: query
          name: page
          schema:
            type: integer
            default: 1
          description: 页码
        - in: query
          name: limit
          schema:
            type: integer
            default: 10
          description: 每页数量
      responses:
        '200':
          description: 获取成功
          content:
            application/json:
              schema:
                $ref: '../components/schemas/order.yaml#/OrderListResponse'
        '401':
          description: 未授权
          content:
            application/json:
              schema:
                $ref: '../components/schemas/common.yaml#/ErrorResponse'
    post:
      summary: 创建订单
      tags:
        - Orders
      security:
        - bearerAuth: []
      parameters:
        - in: header
          name: x-tenant-code
          required: true
          schema:
            type: string
          description: 租户编码
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '../components/schemas/order.yaml#/OrderPayload'
      responses:
        '201':
          description: 创建成功
          content:
            application/json:
              schema:
                $ref: '../components/schemas/order.yaml#/OrderResponse'
        '400':
          description: 请求参数错误
          content:
            application/json:
              schema:
                $ref: '../components/schemas/common.yaml#/ErrorResponse'
        '401':
          description: 未授权
          content:
            application/json:
              schema:
                $ref: '../components/schemas/common.yaml#/ErrorResponse'

  /orders/{id}:
    get:
      summary: 获取订单详情
      tags:
        - Orders
      security:
        - bearerAuth: []
      parameters:
        - in: header
          name: x-tenant-code
          required: true
          schema:
            type: string
          description: 租户编码
        - in: path
          name: id
          required: true
          schema:
            type: integer
          description: 订单ID
      responses:
        '200':
          description: 获取成功
          content:
            application/json:
              schema:
                $ref: '../components/schemas/order.yaml#/OrderResponse'
        '401':
          description: 未授权
          content:
            application/json:
              schema:
                $ref: '../components/schemas/common.yaml#/ErrorResponse'
        '404':
          description: 订单不存在
          content:
            application/json:
              schema:
                $ref: '../components/schemas/common.yaml#/ErrorResponse'
    put:
      summary: 更新订单
      tags:
        - Orders
      security:
        - bearerAuth: []
      parameters:
        - in: header
          name: x-tenant-code
          required: true
          schema:
            type: string
          description: 租户编码
        - in: path
          name: id
          required: true
          schema:
            type: integer
          description: 订单ID
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '../components/schemas/order.yaml#/OrderPayload'
      responses:
        '200':
          description: 更新成功
          content:
            application/json:
              schema:
                $ref: '../components/schemas/order.yaml#/OrderResponse'
        '400':
          description: 请求参数错误
          content:
            application/json:
              schema:
                $ref: '../components/schemas/common.yaml#/ErrorResponse'
        '401':
          description: 未授权
          content:
            application/json:
              schema:
                $ref: '../components/schemas/common.yaml#/ErrorResponse'

  /orders/{id}/assign:
    put:
      summary: 平台管理员分配订单给工人
      description: |
        平台管理员将订单分配给指定的工人。
        - 只有平台管理员(platform_admin)可以执行此操作
        - 不能将订单分配给发布订单的租户的工人
        - 订单必须处于pending状态
      tags:
        - Orders
      security:
        - bearerAuth: []
      parameters:
        - in: header
          name: x-tenant-code
          required: true
          schema:
            type: string
          description: 租户编码（平台管理员使用default）
        - in: path
          name: id
          required: true
          schema:
            type: integer
          description: 订单ID
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - assigneeId
              properties:
                assigneeId:
                  type: integer
                  description: 接单工人ID
                  example: 5
      responses:
        '200':
          description: 订单分配成功
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                  message:
                    type: string
                    example: "订单分配成功"
        '400':
          description: 请求参数错误或业务规则违反
          content:
            application/json:
              schema:
                $ref: '../components/schemas/common.yaml#/ErrorResponse'
        '401':
          description: 未授权（非平台管理员）
          content:
            application/json:
              schema:
                $ref: '../components/schemas/common.yaml#/ErrorResponse'
        '403':
          description: 权限不足（非平台管理员）
          content:
            application/json:
              schema:
                $ref: '../components/schemas/common.yaml#/ErrorResponse'
        '404':
          description: 订单不存在
          content:
            application/json:
              schema:
                $ref: '../components/schemas/common.yaml#/ErrorResponse'

  /orders/{id}/start:
    put:
      summary: 开始处理订单
      tags:
        - Orders
      security:
        - bearerAuth: []
      parameters:
        - in: header
          name: x-tenant-code
          required: true
          schema:
            type: string
          description: 租户编码
        - in: path
          name: id
          required: true
          schema:
            type: integer
          description: 订单ID
      responses:
        '200':
          description: 开始处理成功
          content:
            application/json:
              schema:
                $ref: '../components/schemas/order.yaml#/OrderResponse'
        '400':
          description: 请求参数错误
          content:
            application/json:
              schema:
                $ref: '../components/schemas/common.yaml#/ErrorResponse'
        '401':
          description: 未授权
          content:
            application/json:
              schema:
                $ref: '../components/schemas/common.yaml#/ErrorResponse'
        '403':
          description: 无权操作
          content:
            application/json:
              schema:
                $ref: '../components/schemas/common.yaml#/ErrorResponse'

  /orders/{id}/complete:
    put:
      summary: 完成订单
      tags:
        - Orders
      security:
        - bearerAuth: []
      parameters:
        - in: header
          name: x-tenant-code
          required: true
          schema:
            type: string
          description: 租户编码
        - in: path
          name: id
          required: true
          schema:
            type: integer
          description: 订单ID
      responses:
        '200':
          description: 完成订单成功
          content:
            application/json:
              schema:
                $ref: '../components/schemas/order.yaml#/OrderResponse'
        '400':
          description: 请求参数错误
          content:
            application/json:
              schema:
                $ref: '../components/schemas/common.yaml#/ErrorResponse'
        '401':
          description: 未授权
          content:
            application/json:
              schema:
                $ref: '../components/schemas/common.yaml#/ErrorResponse'
        '403':
          description: 无权操作
          content:
            application/json:
              schema:
                $ref: '../components/schemas/common.yaml#/ErrorResponse'

  /orders/{id}/cancel:
    put:
      summary: 取消订单
      tags:
        - Orders
      security:
        - bearerAuth: []
      parameters:
        - in: header
          name: x-tenant-code
          required: true
          schema:
            type: string
          description: 租户编码
        - in: path
          name: id
          required: true
          schema:
            type: integer
          description: 订单ID
      responses:
        '200':
          description: 取消订单成功
          content:
            application/json:
              schema:
                $ref: '../components/schemas/order.yaml#/OrderResponse'
        '400':
          description: 请求参数错误
          content:
            application/json:
              schema:
                $ref: '../components/schemas/common.yaml#/ErrorResponse'
        '401':
          description: 未授权
          content:
            application/json:
              schema:
                $ref: '../components/schemas/common.yaml#/ErrorResponse'
        '403':
          description: 无权操作
          content:
            application/json:
              schema:
                $ref: '../components/schemas/common.yaml#/ErrorResponse'
