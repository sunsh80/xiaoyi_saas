# ============================================================
# Webhook 接收路径 - Webhook（1 端点）
# 模块: webhook
# ============================================================

paths:
  /v1/webhook/incoming/{platform_code}:
    post:
      summary: 接收外部平台 Webhook 推送
      description: |
        统一的外部 Webhook 接收入口。不同平台通过 path 参数 platform_code 区分。
        请求需携带平台分配的签名信息（各平台签名算法不同）。
        即使订单不存在或处理失败，也返回 HTTP 200 避免推送方重试。
      tags:
        - Webhook
      parameters:
        - name: platform_code
          in: path
          required: true
          schema:
            type: string
            example: saas
          description: 平台编码（如 saas、huolala）
        - name: X-API-Key
          in: header
          required: true
          schema:
            type: string
          description: 平台分配的 API Key
        - name: X-SaaS-Signature
          in: header
          required: true
          schema:
            type: string
            example: sha256=a1b2c3d4...
          description: HMAC-SHA256 签名（SaaS 平台）
        - name: X-SaaS-Timestamp
          in: header
          required: true
          schema:
            type: string
          description: Unix 秒级时间戳（SaaS 平台）
        - name: X-SaaS-Event-ID
          in: header
          schema:
            type: string
          description: 事件唯一 ID（SaaS 平台）
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '../components/schemas/webhook.yaml#/WebhookIncomingPayload'
      responses:
        '200':
          description: 已接收（无论处理成功与否均返回 200）
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  message:
                    type: string
                example:
                  success: true
                  message: 已接收
        '401':
          description: 签名验证失败
          content:
            application/json:
              schema:
                $ref: '../components/schemas/common.yaml#/ErrorResponse'
              example:
                success: false
                message: 签名验证失败
        '404':
          description: 平台未注册
          content:
            application/json:
              schema:
                $ref: '../components/schemas/common.yaml#/ErrorResponse'
              example:
                success: false
                message: 平台未注册
